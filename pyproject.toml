[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptostore"
version = "0.3.0"
description = "Almacenamiento cifrado en el cliente y compartición de archivos (Proyecto 5, Criptografía aplicada)"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "pyhpke>=0.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cryptostore = "cryptostore.client.cli:main"
cryptostore-server = "cryptostore.server.__main__:main"
cryptostore-web = "cryptostore.web.__main__:main"
cryptostore-bench = "cryptostore.benchmarks.__main__:main"

[tool.setuptools.packages.find]
include = ["cryptostore*"]

[tool.setuptools.package-data]
"cryptostore.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
